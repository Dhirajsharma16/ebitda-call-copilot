services:
  - type: web
    name: ebitda-copilot-backend
    env: python
    region: oregon
    plan: free
    rootDir: backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PORT
        value: 10000
      - key: ENVIRONMENT
        value: production
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: GEMINI_API_KEY
        sync: false
      - key: GEMINI_MODEL
        value: gemini-3.8-flash
      - key: GROQ_API_KEY
        sync: false
      - key: GROQ_MODEL
        value: llama-3.3-70b-versatile
      - key: SUPABASE_URL
        value: https://rplsydmrthvobbkajrgn.supabase.co
      - key: SUPABASE_ANON_KEY
        value: sb_publishable_rB1OQQxBCOJ8SkB4B4WY5w_W7HHl6cq
      - key: SUPABASE_PUBLISHABLE_KEY
        value: sb_publishable_rB1OQQxBCOJ8SkB4B4WY5w_W7HHl6cq
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: FRONTEND_ORIGIN
        value: "*"
